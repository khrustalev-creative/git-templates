<script>
  ;(function () {
    let useLocal = true
    let lastJsTime = 0
    let lastCssTime = 0
    let cssVersion = 0

    function load() {
      const host = "http://localhost:5500"

      const t = Date.now()

      cssVersion++
      const css = document.createElement("link")
      css.rel = "stylesheet"
      css.href = `${host}/styles.css?t=${t}&v=${cssVersion}`
      css.dataset.version = cssVersion
      css.onerror = () => {
        console.error("Ошибка загрузки CSS")
      }
      document.head.appendChild(css)

      const js = document.createElement("script")
      js.src = `${host}/scripts.js?t=${t}`
      js.onerror = () => {
        console.error("Ошибка загрузки JS")
      }
      document.head.appendChild(js)

      console.log("Файлы загружены с локального сервера")
    }

    function updateCSS(host) {
      cssVersion++
      const t = Date.now()

      document.querySelectorAll(`link[href*="${host}"]`).forEach((link) => {
        if (link.href.includes("styles.css")) {
          link.remove()
        }
      })

      const newCss = document.createElement("link")
      newCss.rel = "stylesheet"
      newCss.href = `${host}/styles.css?t=${t}&v=${cssVersion}`
      newCss.dataset.version = cssVersion
      document.head.appendChild(newCss)

      console.log("CSS обновлен")
    }

    setInterval(async () => {
      try {
        const host = "http://localhost:5500"

        const [jsRes, cssRes] = await Promise.all([
          fetch(`${host}/scripts.js?check=${Date.now()}`),
          fetch(`${host}/styles.css?check=${Date.now()}`),
        ])

        const jsTime = new Date(jsRes.headers.get("last-modified")).getTime()
        const cssTime = new Date(cssRes.headers.get("last-modified")).getTime()

        if (lastJsTime && jsTime > lastJsTime) {
          console.log("JS изменен, перезагружаю...")
          window.location.reload()
          return
        }

        if (lastCssTime && cssTime > lastCssTime) {
          console.log("CSS изменен, обновляю...")
          updateCSS(host)
        }

        lastJsTime = jsTime || lastJsTime
        lastCssTime = cssTime || lastCssTime
      } catch (error) {
        console.error("Ошибка проверки обновлений:", error.message)
      }
    }, 300)

    load()
  })()
</script>
