  /* ============================================================================================================================================================================== */
  /* СБРОСЫ ======================================================================================================================================================================= */
  /* ============================================================================================================================================================================== */

  /* html,
body {
  margin: 0;

  /* -------------------------------------------------------------------------------------- */

  /* Параграфы Taptop */
  p {
    margin-block-start: 0;
    margin-block-end: 0;
  }

  /* -------------------------------------------------------------------------------------- */

  /* Ссылки и кнопки по умолчанию */
  a,
  button {
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    border: none;
    background: none;
  }

  /* -------------------------------------------------------------------------------------- */

  /* Цвет области при нажатии на сенсоре */
  a,
  button,
  input,
  textarea,
  select {
    -webkit-tap-highlight-color: transparent;
    tap-highlight-color: transparent;
  }

  /* -------------------------------------------------------------------------------------- */

  /* Предпочтение уменьшенного движения */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0ms !important;
      transition-duration: 0ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* -------------------------------------------------------------------------------------- */

  /* Убрать лишние элементы таптопа */
  re-captcha {
    display: none !important;
  }

  /* ============================================================================================================================================================================== */
  /* НАСТРОЙКИ ======================================================================================================================================================================= */
  /* ============================================================================================================================================================================== */

  /* БРЕЙКПОИНТЫ ====================================================================================================================================================== */
  :root {
    /* Задаются здесь и используются по всему проекту в скриптах */
    /* В медиа-запросах в css не поддерживается такой подход, нужно выставялть отдельно в каждом медиа-запросе */
    /* В этом файле find and replace, чтобы быстро поменять */
    --breakpoint-laptop: 992;
    --breakpoint-tablet: 991;
    --breakpoint-mobile: 479;
  }

  /* ЦВЕТ ДИЗАЙН-СИСТЕМА ====================================================================================================================================================== */
  /* ОСНОВНАЯ ТЕМА */
  :root {
    /* Базовые ------------------------------------- */
    /* Текст и иконки */
    --color-base-foreground: #191919;
    --color-base-foreground-static: #191919;

    /* Приглушенный текст и иконки */
    --color-base-foreground-muted: #393939;
    --color-base-foreground-mute-static: #393939;

    /* Фон */
    --color-base-background: #ffffff;
    --color-base-background-static: #ffffff;

    /* Обводки/линии */
    --color-base-border: #363636;
    --color-base-border-static: #363636;

    /* Альтернативные ------------------------------------- */
    /* Текст и иконки */
    --color-alternate-foreground: #ffffff;
    --color-alternate-foreground-static: #ffffff;

    /* Приглушенный текст и иконки */
    --color-alternate-foreground-muted: #c2c2c2;
    --color-alternate-foreground-mute-static: #c2c2c2;

    /* Фон */
    --color-alternate-background: #191919;
    --color-alternate-background-static: #191919;

    /* Обводки/линии */
    --color-alternate-border: #c8c8c8;
    --color-alternate-border-static: #c8c8c8;

    /* Бренд ------------------------------------- */
    --color-brand: #1f31f1;
    --color-brand-hover: #1d2dd7;
    /* + Может быть focus / pressed */

    /* Системные ------------------------------------- */
    /* Успех */
    --color-success: #5af064;

    /* Ошибка */
    --color-error: #ef5d5d;

    /* Прозрачность ------------------------------------- */
    --opacity-line: 0.1;
    --opacity-disabled: 0.3;
    --opacity-foreground: 0.5;
    --opacity-background: 0.7;
  }

  /* Прозрачность фона */

  /* КАЧЕСТВО И ЧИТАБИЛЬНОСТЬ ШРИФТА =========================================================================== */
  html {
    /* Стандартное сглаживание */
    text-rendering: optimizeLegibility;
    /* WebKit браузеры (Chrome, Safari) */
    -webkit-font-smoothing: antialiased;
    /* Firefox */
    -moz-osx-font-smoothing: grayscale;
    /* Будущее свойство */
    font-smooth: always;
    /* Оптимизация производительности */
    shape-rendering: geometricPrecision;
    /* Улучшение читаемости */
    font-kerning: normal;
    font-variant-ligatures: common-ligatures;
    font-feature-settings: "kern", "liga", "clig", "calt";
  }

  /* РАЗМЕР / МЕЖБУКВЕННОЕ РАССТОЯНИЕ / МЕЖСТРОЧНОЕ РАССТОЯНИЕ И ТД ====================================================================================================================================================== */
  /* Переменные для шрифтов только если есть дизайн-система */

  /* АНИМАЦИИ ====================================================================================================================================================== */
  :root {
    /* Кривая ускорения */
    /* --animation-timing-function: cubic-bezier(0.32, 0.72, 0, 1); */
    /* --animation-timing-function: cubic-bezier(0.85, 0.01, 0.04, 1); */
    /* --animation-timing-function: cubic-bezier(0.58, 0, 0.43, 1); */
    /* --animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); */
    /* --animation-timing-function: cubic-bezier(0.625, 0.05, 0, 1); */
    --animation-timing-function: cubic-bezier(0.3, 0.7, 0.05, 1);

    /* -------------------------------------------------------------------------------------- */

    /* Длительность анимаций */
    --animation-duration-fast: 200ms;
    --animation-duration-medium: 400ms;
    --animation-duration-slow: 800ms;
    --animation-duration-super-slow: 1300ms;

    /* -------------------------------------------------------------------------------------- */

    /* Для бегущей строки */
    --animation-marquee: 20s infinite linear;
  }

  /* НАСТРОЙКИ =========================================================================== */

  /* Предотвращение дерганий при открытии попапов */
  html {
    scrollbar-gutter: stable;
    /* Нативная плавная прокрутка */
    /* В редакторе Taptop не работает прокрутка с плавностью */
    /* scroll-behavior: smooth; */
    background-color: var(--color-base-background);
  }

  /* ============================================================================================================================================================================== */
  /* ЭФФЕКТЫ ======================================================================================================================================================================= */
  /* ============================================================================================================================================================================== */

  /* ТЕНЬ ====================================================================================================================================================== */
  :root {
    --shadow-blur: 1rem;
    --shadow-color: rgba(0, 0, 0, 0.15);
  }

  /* РАЗМЫТИЕ ====================================================================================================================================================== */
  :root {
    --blur: 0.5rem;
  }

  .blur {
    -webkit-filter: blur(0.5rem); /* для Safari */
  }

  .v-blur {
    -webkit-filter: blur(var(--blur)); /* для Safari */
    filter: blur(var(--blur));
  }

  /* РАЗМЫТИЕ НА ФОНЕ ====================================================================================================================================================== */
  :root {
    --backdrop-blur: 0.5rem;
  }

  .backdrop-blur {
    -webkit-backdrop-filter: blur(0.5rem); /* для Safari */
  }

  .v-backdrop-blur {
    -webkit-backdrop-filter: blur(var(--blur)); /* для Safari */
    backdrop-filter: blur(var(--blur));
  }

  /* РАЗМЕРЫ ИЗОБРАЖЕНИЙ И БЛОКОВ ======================================================================================================================================================================= */

  /* На всю ширину и высоту */
  .v-icon img,
  .v-icon svg,
  .icon svg,
  .icon img,
  .media-full-size,
  .media-full-size svg,
  .media-full-size video,
  .media-full-size img,
  .v-icon .embed,
  .icon .embed {
    min-height: 0;
    height: 100%;
    width: 100%;
  }

  .v-icon svg,
  .v-icon svg path,
  .v-icon svg g rect,
  .icon svg,
  .icon svg path,
  .icon svg g rect {
    color: inherit;
    fill: currentColor !important;
    stroke: currentColor !important;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* На всю ширину и авто высотой для сохранения пропорционалности */
  .media-width-auto,
  .media-width-auto svg,
  .media-width-auto video,
  .media-width-auto img {
    min-height: 0;
    height: 100%;
    width: auto;
  }

  /* На всю высота и авто высотой для сохранения пропорционалности */
  .media-height-auto,
  .media-height-auto svg,
  .media-height-auto video,
  .media-height-auto img {
    min-height: 0;
    height: auto;
    width: 100%;
  }

  /* Для webflow вредно */
  svg {
    overflow: visible !important;
  }

  /* Для фоновых элементов или картинок */
  /* В Таптоп нельзя задать object-fit в кастом пропс */
  .layer-background {
    object-fit: cover;
  }

  /* ВЫСОТА ХЕДЕРА =========================================================================== */
  /* Для подставления в отступы секций и в скрипты, чтобы всегда учитывался точный размер */

  @media screen and (min-width: 992px) {
    :root {
      /* Дефолтное значение для десктопа */
      --header-height: 6rem; /* высота шапки */
      --header-footer: 5rem; /* высота нижней панели мобильного меню */
    }
  }

  /* Планшет */
  @media screen and (min-width: 480px) and (max-width: 991px) {
    :root {
      --header-height: 6rem;
      --header-footer: 5rem;
    }
  }

  /* Мобилка */
  @media screen and (max-width: 479px) {
    :root {
      --header-height: 6rem;
      --header-footer: 5rem;
    }
  }

  /* Работает в связке со скриптом, который при загрузке страницы удаляет элементы */

  /* ========================================================================================================================================================================== */

  /* ДЕКОРАТИВНАЯ СЕТКА ====================================================================================================================================================== */
  /* [+] Колонка с бордерами справа для направляющих */
  .grid-decor .grid-decor__column:not(:last-child) {
    border-right: var(--size-line) solid var(--color-base-foreground);
  }
  /* [+] Колонка с бордерами слева для направляющих */
  .grid-decor .grid-decor__column:not(:first-child) {
    border-left: var(--size-line) solid var(--color-base-foreground);
  }

  /* ========================================================================================================================================================================== */
  /* ВСПОМОГАТЕЛЬНЫЕ СТИЛИ ======================================================================================================================================================= */
  /* ========================================================================================================================================================================== */

  /* [+] Колонка с бордерами справа для направляющих */
  .styleguide-grid .styleguide-grid__column:not(:last-child) {
    border-right: var(--size-line) solid var(--color-styleguide-red);
  }
  /* [+] Колонка с бордерами слева для направляющих */
  .styleguide-grid .styleguide-grid__column:not(:first-child) {
    border-left: var(--size-line) solid var(--color-styleguide-red);
  }

  /* Для Pixel Perfect */
  /* В Taptop нельзя выставить стиль для картинки */
  .pixel-perfect__img img {
    width: 100%;
    height: auto;
  }

  .styleguide__icon img,
  .styleguide__icon svg {
    width: 100%;
    height: 100%;
  }

  /* В редакторе Taptop нельзя задать стили для пустых блоков, у них есть padding, который мешает */
  .mosaic-wrap.mosaic-wrap--show_empty_mode .div:empty::after,
  .mosaic-wrap .blocklist__list:empty::after,
  .mosaic-wrap .list:empty::after,
  .mosaic-wrap.mosaic-wrap--show_empty_mode .mosaic-ani-tabs__item:empty::after,
